<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>College LMS - ER Diagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(15,23,42,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
#toolbar h1 { font-size: 18px; font-weight: 700; color: #60a5fa; white-space: nowrap; }
#toolbar .sep { width: 1px; height: 24px; background: #334155; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }
#controls { margin-left: auto; display: flex; gap: 8px; }
#controls button { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
#controls button:hover { background: #334155; color: #e2e8f0; }
#controls button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
#viewport { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; }
#viewport.dragging { cursor: grabbing; }
#canvas { position: absolute; transform-origin: 0 0; }
svg.relations { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
.table { position: absolute; background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; min-width: 200px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); transition: box-shadow 0.2s, border-color 0.2s; }
.table:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.5); border-color: #475569; z-index: 10; }
.table-header { padding: 8px 12px; font-weight: 700; font-size: 13px; text-align: center; letter-spacing: 0.5px; }
.table-body { padding: 0; }
.col { padding: 3px 12px; font-size: 11px; font-family: 'Cascadia Code', 'Fira Code', monospace; border-top: 1px solid rgba(51,65,85,0.5); white-space: nowrap; display: flex; justify-content: space-between; gap: 12px; }
.col:first-child { border-top: none; }
.col-name { color: #cbd5e1; }
.col-type { color: #64748b; font-size: 10px; }
.col.pk .col-name { color: #fbbf24; font-weight: 600; }
.col.fk .col-name { color: #60a5fa; }
.col.uk .col-name { color: #a78bfa; }
.badge { display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-left: 4px; font-weight: 600; }
.badge-pk { background: rgba(251,191,36,0.15); color: #fbbf24; }
.badge-fk { background: rgba(96,165,250,0.15); color: #60a5fa; }
.badge-uk { background: rgba(167,139,250,0.15); color: #a78bfa; }
/* Category colors */
.cat-user .table-header { background: linear-gradient(135deg, #1e40af, #1e3a8a); color: #93c5fd; }
.cat-academic .table-header { background: linear-gradient(135deg, #065f46, #064e3b); color: #6ee7b7; }
.cat-course .table-header { background: linear-gradient(135deg, #7c2d12, #6b1d0e); color: #fdba74; }
.cat-assessment .table-header { background: linear-gradient(135deg, #581c87, #4c1d95); color: #c4b5fd; }
.cat-verification .table-header { background: linear-gradient(135deg, #991b1b, #7f1d1d); color: #fca5a5; }
.cat-material .table-header { background: linear-gradient(135deg, #166534, #14532d); color: #86efac; }
.cat-session .table-header { background: linear-gradient(135deg, #854d0e, #713f12); color: #fde047; }
.cat-other .table-header { background: linear-gradient(135deg, #475569, #334155); color: #cbd5e1; }
.rel-line { fill: none; stroke-width: 1.5; opacity: 0.5; }
.rel-line:hover { opacity: 1; stroke-width: 2.5; }
.rel-1to1 { stroke: #60a5fa; }
.rel-1tom { stroke: #34d399; }
.rel-mtom { stroke: #f472b6; }
.rel-label { font-size: 10px; font-weight: 700; fill: #94a3b8; pointer-events: none; }
.rel-label-bg { fill: #0f172a; opacity: 0.8; }
#minimap { position: fixed; bottom: 16px; right: 16px; width: 200px; height: 140px; background: rgba(15,23,42,0.9); border: 1px solid #334155; border-radius: 8px; z-index: 100; overflow: hidden; }
#minimap canvas { width: 100%; height: 100%; }
#minimap-viewport { position: absolute; border: 1.5px solid #3b82f6; border-radius: 2px; background: rgba(59,130,246,0.1); pointer-events: none; }
#tooltip { position: fixed; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; font-size: 12px; z-index: 200; pointer-events: none; display: none; max-width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
#tooltip .tt-title { font-weight: 700; color: #60a5fa; margin-bottom: 4px; }
#tooltip .tt-body { color: #94a3b8; line-height: 1.5; }
</style>
</head>

  {from:"course",to:"gradeConfig",card:"1:0..1",type:"1to1"},
  {from:"course",to:"assessment",card:"1:*",type:"1tom"},
  {from:"course",to:"material",card:"1:*",type:"1tom"},
  {from:"course",to:"attendance",card:"1:*",type:"1tom"},
  {from:"assessment",to:"question",card:"1:*",type:"1tom"},
  {from:"assessment",to:"attempt",card:"1:*",type:"1tom"},
  {from:"assessment",to:"manualGrade",card:"1:*",type:"1tom"},
  {from:"attempt",to:"answer",card:"1:*",type:"1tom"},
  {from:"question",to:"answer",card:"1:*",type:"1tom"},
  {from:"attempt",to:"faceVerification",card:"1:0..1",type:"1to1"},
  {from:"material",to:"materialView",card:"1:*",type:"1tom"},
  {from:"material",to:"readingProgress",card:"1:*",type:"1tom"},
  {from:"material",to:"videoFaceVerification",card:"1:*",type:"1tom"},
  {from:"liveSession",to:"liveAttendance",card:"1:*",type:"1tom"},
  {from:"manualAttSession",to:"manualAttRecord",card:"1:*",type:"1tom"},
  {from:"question",to:"questionReport",card:"1:*",type:"1tom"},
  {from:"course",to:"courseClass",card:"1:*",type:"1tom"},
  {from:"class",to:"courseClass",card:"1:*",type:"1tom"},
];

const tableMap = {};
const tableEls = {};
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const relSvg = document.getElementById('relSvg');
let scale = 1, panX = 0, panY = 0, showRels = true, autoFitted = false;

// Render tables
tables.forEach(t => {
  tableMap[t.id] = t;
  const el = document.createElement('div');
  el.className = `table ${t.cat}`;
  el.id = `tbl-${t.id}`;
  el.style.left = t.x + 'px';
  el.style.top = t.y + 'px';
  let html = `<div class="table-header">${t.name}</div><div class="table-body">`;
  t.cols.forEach(c => {
    let cls = 'col';
    let badge = '';
    if (c.pk) { cls += ' pk'; badge = '<span class="badge badge-pk">PK</span>'; }
    if (c.fk) { cls += ' fk'; badge += '<span class="badge badge-fk">FK</span>'; }
    if (c.uk) { cls += ' uk'; badge += '<span class="badge badge-uk">UK</span>'; }
    html += `<div class="${cls}"><span class="col-name">${c.n}${badge}</span><span class="col-type">${c.t}</span></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
  canvas.appendChild(el);
  tableEls[t.id] = el;
});

function getCenter(id) {
  const t = tableMap[id];
  const el = tableEls[id];
  if (!el) return {x:0,y:0};
  const w = el.offsetWidth || 200;
  const h = el.offsetHeight || 100;
  return { x: t.x + w/2, y: t.y + h/2, w, h, t };
}

function getEdgePoint(fromId, toId) {
  const f = getCenter(fromId), t = getCenter(toId);
  const dx = t.x - f.x, dy = t.y - f.y;
  const hw = f.w/2, hh = f.h/2;
  let ex, ey;
  if (Math.abs(dx) * hh > Math.abs(dy) * hw) {
    ex = f.x + (dx > 0 ? hw : -hw);
    ey = f.y + dy * hw / Math.abs(dx);
  } else {
    ey = f.y + (dy > 0 ? hh : -hh);
    ex = f.x + dx * hh / Math.abs(dy);
  }
  return {x: ex, y: ey};
}

function drawRelations() {
  relSvg.innerHTML = '';
  const svgNS = 'http://www.w3.org/2000/svg';
  relSvg.setAttribute('width', 3200);
  relSvg.setAttribute('height', 3000);
  rels.forEach((r, i) => {
    const p1 = getEdgePoint(r.from, r.to);
    const p2 = getEdgePoint(r.to, r.from);
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${p1.x},${p1.y} L${p2.x},${p2.y}`);
    path.setAttribute('class', `rel-line rel-${r.type}`);
    path.dataset.idx = i;
    relSvg.appendChild(path);
    // Cardinality labels
    const labelFrom = document.createElementNS(svgNS, 'text');
    const labelTo = document.createElementNS(svgNS, 'text');
    const [cFrom, cTo] = r.card.split(':');
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const off1 = 18, off2 = 18;
    // Label backgrounds + text at source
    const bgFrom = document.createElementNS(svgNS, 'rect');
    const lfx = p1.x + Math.cos(angle) * off1 - 10;
    const lfy = p1.y + Math.sin(angle) * off1 - 8;
    bgFrom.setAttribute('x', lfx); bgFrom.setAttribute('y', lfy);
    bgFrom.setAttribute('width', cFrom.length*7+6); bgFrom.setAttribute('height', 14);
    bgFrom.setAttribute('class', 'rel-label-bg');
    relSvg.appendChild(bgFrom);
    labelFrom.setAttribute('x', lfx + 3);
    labelFrom.setAttribute('y', lfy + 11);
    labelFrom.setAttribute('class', 'rel-label');
    labelFrom.textContent = cFrom;
    // Label backgrounds + text at target
    const bgTo = document.createElementNS(svgNS, 'rect');
    const ltx = p2.x - Math.cos(angle) * off2 - 10;
    const lty = p2.y - Math.sin(angle) * off2 - 8;
    bgTo.setAttribute('x', ltx); bgTo.setAttribute('y', lty);
    bgTo.setAttribute('width', cTo.length*7+6); bgTo.setAttribute('height', 14);
    bgTo.setAttribute('class', 'rel-label-bg');
    relSvg.appendChild(bgTo);
    labelTo.setAttribute('x', ltx + 3);
    labelTo.setAttribute('y', lty + 11);
    labelTo.setAttribute('class', 'rel-label');
    labelTo.textContent = cTo;
    relSvg.appendChild(labelFrom);
    relSvg.appendChild(labelTo);
  });
}

setTimeout(drawRelations, 100);

// Pan & Zoom
let dragging = false, startX, startY;
viewport.addEventListener('mousedown', e => {
  if (e.target.closest('.table')) return;
  dragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = e.clientX - startX; panY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * d;
  panY = my - (my - panY) * d;
  scale *= d;
  scale = Math.max(0.2, Math.min(2, scale));
  applyTransform();
}, {passive: false});

function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  updateMinimap();
}

function zoomIn() { scale = Math.min(2, scale * 1.2); applyTransform(); }
function zoomOut() { scale = Math.max(0.2, scale * 0.8); applyTransform(); }
function resetView() { scale = 0.75; panX = 0; panY = 0; applyTransform(); }
function toggleRels() {
  showRels = !showRels;
  relSvg.style.display = showRels ? '' : 'none';
  document.getElementById('btnRel').classList.toggle('active', showRels);
}

// Minimap
function updateMinimap() {
  const mc = document.getElementById('minimapCanvas');
  const ctx = mc.getContext('2d');
  mc.width = 200; mc.height = 140;
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,200,140);
  const s = 0.07;
  ctx.translate(4, 4);
  tables.forEach(t => {
    const el = tableEls[t.id];
    const w = (el?.offsetWidth || 200) * s;
    const h = (el?.offsetHeight || 100) * s;
    const colors = {
      'cat-user':'#3b82f6','cat-academic':'#10b981','cat-course':'#f97316',
      'cat-assessment':'#8b5cf6','cat-verification':'#ef4444','cat-material':'#22c55e',
      'cat-session':'#eab308','cat-other':'#64748b'
    };
    ctx.fillStyle = colors[t.cat] || '#64748b';
    ctx.fillRect(t.x*s, t.y*s, w, h);
  });
  // Viewport indicator
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const vl = -panX/scale, vt = -panY/scale;
  const mvp = document.getElementById('minimap-viewport');
  mvp.style.left = (vl*s+4)+'px';
  mvp.style.top = (vt*s+4)+'px';
  mvp.style.width = (vw*scale*s)+'px';
  mvp.style.height = (vh*scale*s)+'px';
}
setTimeout(updateMinimap, 200);

// Tooltip on relation hover
const tooltip = document.getElementById('tooltip');
relSvg.addEventListener('mouseover', e => {
  if (!e.target.classList.contains('rel-line')) return;
  const r = rels[e.target.dataset.idx];
  const ft = tableMap[r.from].name, tt = tableMap[r.to].name;
  tooltip.querySelector('.tt-title').textContent = `${ft} → ${tt}`;
  tooltip.querySelector('.tt-body').textContent = `Relationship: ${r.card}\n${ft} has ${r.card} ${tt}`;
  tooltip.style.display = 'block';
});
relSvg.addEventListener('mousemove', e => {
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY + 12) + 'px';
});
relSvg.addEventListener('mouseout', () => { tooltip.style.display = 'none'; });

function autoFit() {
  let maxX = 0, maxY = 0;
  tables.forEach(t => {
    const el = tableEls[t.id];
    const w = el?.offsetWidth || 200;
    const h = el?.offsetHeight || 100;
    if (t.x + w > maxX) maxX = t.x + w;
    if (t.y + h > maxY) maxY = t.y + h;
  });
  maxX += 40; maxY += 40;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  scale = Math.min(vw / maxX, vh / maxY);
  scale = Math.min(scale, 1.0);
  panX = (vw - maxX * scale) / 2;
  panY = (vh - maxY * scale) / 2;
  if (panX < 10) panX = 10;
  if (panY < 10) panY = 10;
  autoFitted = true;
  applyTransform();
  drawRelations();
}

window.addEventListener('resize', autoFit);
setTimeout(autoFit, 300);
</script>
</body>
